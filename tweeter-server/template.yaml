#
# DynamoDB Tables
#

UsersTable:
  Type: AWS::DynamoDB::Table
  Properties:
    TableName: users
    AttributeDefinitions:
      - AttributeName: alias
        AttributeType: S
    KeySchema:
      - AttributeName: alias
        KeyType: HASH
    BillingMode: PROVISIONED
    ProvisionedThroughput:
      ReadCapacityUnits: 1
      WriteCapacityUnits: 1
    # No indexes needed—lookup is always by alias

FollowsTable:
  Type: AWS::DynamoDB::Table
  Properties:
    TableName: follows
    AttributeDefinitions:
      - AttributeName: follower_alias
        AttributeType: S
      - AttributeName: followee_alias
        AttributeType: S
    KeySchema:
      - AttributeName: follower_alias
        KeyType: HASH
      - AttributeName: followee_alias
        KeyType: RANGE
    BillingMode: PROVISIONED
    ProvisionedThroughput:
      ReadCapacityUnits: 1
      WriteCapacityUnits: 1

    GlobalSecondaryIndexes:
      - IndexName: follows_index
        KeySchema:
          - AttributeName: followee_alias
            KeyType: HASH
          - AttributeName: follower_alias
            KeyType: RANGE
        Projection:
          ProjectionType: ALL
        ProvisionedThroughput:
          ReadCapacityUnits: 1
          WriteCapacityUnits: 1

StatusesTable:
  Type: AWS::DynamoDB::Table
  Properties:
    TableName: statuses
    AttributeDefinitions:
      - AttributeName: user_alias
        AttributeType: S
      - AttributeName: timestamp
        AttributeType: N
      - AttributeName: feed_alias
        AttributeType: S
    KeySchema:
      # Story table primary key
      - AttributeName: user_alias
        KeyType: HASH
      - AttributeName: timestamp
        KeyType: RANGE

    BillingMode: PROVISIONED
    ProvisionedThroughput:
      ReadCapacityUnits: 1
      WriteCapacityUnits: 1

    GlobalSecondaryIndexes:
      # Story index: query posts made BY a specific user
      - IndexName: story_index
        KeySchema:
          - AttributeName: user_alias
            KeyType: HASH
          - AttributeName: timestamp
            KeyType: RANGE
        Projection:
          ProjectionType: ALL
        ProvisionedThroughput:
          ReadCapacityUnits: 1
          WriteCapacityUnits: 1

      # Feed index: query posts FOR a specific user (fan-out)
      - IndexName: feed_index
        KeySchema:
          - AttributeName: feed_alias
            KeyType: HASH
          - AttributeName: timestamp
            KeyType: RANGE
        Projection:
          ProjectionType: ALL
        ProvisionedThroughput:
          ReadCapacityUnits: 1
          WriteCapacityUnits: 1
